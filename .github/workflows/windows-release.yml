# Builds the Windows installer of the personal fork and attaches it to a GitHub release.
# Assets (the app looks for exactly these names):
#   Deskflow-x64.msi          the WiX installer made by the CPack "package" target
#   Deskflow-x64.msi.sha256   `sha256sum` format: "<hex>  <name>"
# Release version = upstream MAJOR.MINOR.PATCH + commits since that tag (see packaging/personal/release.sh).
name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z.N) to build and attach to. Empty: build only, keep run artifacts."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  ASSET: Deskflow-x64.msi
  QT_VERSION: "6.12"
  VCPKG_TRIPLET: x64-windows-release
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write # upload the assets to the release
    steps:
      - name: Check tag
        shell: bash
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$TAG' is not like v1.27.0.31" >&2
            exit 1
          fi

      # Full history so `git describe` gives the same version as the tag.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # The upstream release tags (v1.27.0) are not pushed to the fork, but the version is derived from them.
      - name: Fetch upstream version tags
        shell: bash
        run: git fetch --no-tags --quiet https://github.com/deskflow/deskflow.git 'refs/tags/v*.*.*:refs/tags/v*.*.*'

      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4
        with:
          arch: amd64
          spectre: true

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/.github/actions/install-dependencies/aqt.ini
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: windows-${{ env.QT_VERSION }}
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e

      - name: Build and cache OpenSSL (vcpkg)
        id: vcpkg
        uses: johnwason/vcpkg-action@04c68c847bf5196ecaa72331ecf51208583916ef # v8
        with:
          pkgs: openssl
          extra-args: --classic --host-triplet=${{ env.VCPKG_TRIPLET }}
          triplet: ${{ env.VCPKG_TRIPLET }}
          token: ${{ github.token }}
          revision: master

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.Firewall.wixext/5.0.2

      - name: Configure
        shell: bash
        run: >
          cmake -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}

      - name: Build and package
        shell: bash
        run: cmake --build build --config Release -j8 --target package

      - name: Check version and rename assets
        shell: bash
        run: |
          VERSION=$(sed -n 's/^const auto kVersion = "\(.*\)";$/\1/p' build/src/lib/common/VersionInfo.h)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version '$VERSION'" >&2; exit 1; }
          if [ -n "$TAG" ] && [ "v$VERSION" != "$TAG" ]; then
            echo "built version $VERSION does not match tag $TAG" >&2
            exit 1
          fi
          echo "version: $VERSION"
          ls build/deskflow-*.msi build/deskflow-*-portable.zip
          msis=(build/deskflow-*.msi)
          [ "${#msis[@]}" = 1 ] || { echo "expected exactly one msi" >&2; exit 1; }
          mkdir dist
          cp "${msis[0]}" "dist/$ASSET"
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256" && sha256sum -c "$ASSET.sha256")
          cat "dist/$ASSET.sha256"
          echo "size: $(stat -c %s "dist/$ASSET")"
          [ "$(stat -c %s "dist/$ASSET")" -le $((300 * 1024 * 1024)) ] || { echo "larger than 300 MB" >&2; exit 1; }

      - name: Smoke test the portable build
        shell: bash
        run: |
          7z x build/deskflow-*-portable.zip -otmp/deskflow-pkg > /dev/null
          exe=$(find tmp/deskflow-pkg -name "deskflow-core.exe" -type f | head -1)
          exe_dir=$(dirname "$exe")
          pkg_root=$(dirname "$exe_dir")
          export PATH="$exe_dir:$pkg_root:$pkg_root/lib:$PATH"
          "$exe" --version

      - name: Upload run artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: ${{ env.TAG != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
